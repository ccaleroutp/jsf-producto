<ui:composition
    template="/WEB-INF/templates/welcome.xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core">
    
    <ui:define name="contenido">
        <h2>Lista de Productos</h2>
        <h:dataTable value="#{productoBean.lista}"
                     var="p"
                     styleClass="tabla"
                     rowClasses="filaBlanca, filaGris">
            <h:column>
                <f:facet name="header">Código</f:facet>
                    #{p.codigo}
            </h:column>
            
            <h:column>
                <f:facet name="header">Nombre</f:facet>
                    #{p.nombre}
            </h:column>
            <h:column>
                <f:facet name="header">Precio</f:facet>
                S/. #{p.precio}
            </h:column>
            <h:column>
                <f:facet name="header">Stock</f:facet>
                    #{p.stock}
            </h:column>
        </h:dataTable>
    </ui:define>
</ui:composition>
